[package]
name = "embed-avl"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "intrusive avl tree"
keywords = ["avl", "intrusive"]
categories = ["data-structures", "no-std"]
homepage = "https://github.com/NaturalIO/embed-collections-rs"
readme = "../README.md"

[dependencies]
pointers = {version=">=0.2"}
log = { version="0.4", optional=true}

[dev-dependencies]
embed-collections-test = {path="../test-common"}
log = { version="0.4"}
captains-log = "0"
rstest = "0"
fastrand = "2.3"
# for doc
format-attr = "0"

[features]
default = []
std = []
# only for test
trace_log = ["dep:log", "embed-collections-test/trace_log"]

[package.metadata.docs.rs]
all-features = true
# enable features in the documentation
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true
